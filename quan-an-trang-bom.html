<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quán ăn Trảng Bom | XOX Beer Garden</title>
  <meta name="description" content="Quán ăn Trảng Bom, không gian xanh, phù hợp gia đình & tiệc 20–120 khách.">

  <!-- CSS CHÍNH -->
  <link rel="stylesheet" href="styles.css">

  <!-- AOS CSS (CHỈ 1 LẦN / 1 TRANG) -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-067KJC9TT8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-067KJC9TT8');
  </script>
</head>

<body>

  <!-- NÚT VỀ TRANG CHỦ -->
  <a href="./" class="back-home">← Trang chủ</a>

  <!-- HERO -->
  <header class="wrap hero" data-aos="fade-up">
    <h1>Quán ăn tại Trảng Bom – không gian xanh</h1>
    <p class="lead">
      XOX Beer Garden – quán ăn sân vườn, đèn vàng ấm, phù hợp gia đình & tiệc 20–120 khách.
    </p>

    <div class="btns">
      <a class="btn primary" href="tel:0975229739">📞 Gọi đặt
        bàn</a>
      <a class="btn" href="assets/menu/xox-menu.pdf" target="_blank">Xem MENU</a>
    </div>
  </header>

  <!-- NỘI DUNG -->
  <main class="wrap">
    <h2 data-aos="fade-right">Điểm mạnh</h2>
    <div class="grid">
      <div class="card" data-aos="zoom-in">🌿 Không gian nhiều cây xanh</div>
      <div class="card" data-aos="zoom-in" data-aos-delay="100">👨‍👩‍👧‍👦 Phù hợp gia đình</div>
      <div class="card" data-aos="zoom-in" data-aos-delay="200">🎉 Nhận tiệc sinh nhật</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    © XOX Beer Garden – Trảng Bom
  </footer>

  <!-- AOS JS (ĐỂ CUỐI BODY – CHỈ 1 LẦN) -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 650,
      once: true,
      offset: 60
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function sendLeadEvent(channel) {
        gtag('event', 'generate_lead', {
          lead_channel: channel
        });
      }

      document.querySelectorAll("a[href^='tel:']").forEach(function (el) {
        el.addEventListener("click", function (e) {
          sendLeadEvent('call');
        });
      });

      document.querySelectorAll("a[href*='zalo.me']").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          sendLeadEvent('zalo');
          var url = el.getAttribute('href');
          setTimeout(function () {
            window.open(url, '_blank');
          }, 250);
        });
      });

      document.querySelectorAll("a[href*='facebook.com'], a[href*='m.me']").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          sendLeadEvent('messenger');
          var url = el.getAttribute('href');
          setTimeout(function () {
            window.open(url, '_blank');
          }, 250);
        });
      });
    });
  </script>
</body>

</html>
